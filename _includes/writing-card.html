<article class="entry-card" data-entry data-search="{{ post.title | escape }}" {% if include.filters %}{% if post.title contains 'AtCoder' or post.title contains 'atcoder' %}data-category="atcoder"{% else %}data-category="leetcode"{% endif %}{% endif %}>
<div class="entry-meta"><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%Y.%m.%d' }}</time>{% if include.filters %}<span>{% if post.title contains 'AtCoder' or post.title contains 'atcoder' %}AtCoder{% else %}LeetCode{% endif %}</span>{% endif %}</div>
<a class="entry-link" href="{{ post.url | relative_url }}"><h2>{{ post.title | escape }}</h2><p>{{ post.content | strip_html | strip_newlines | truncate: 110 | escape }}</p><span class="entry-arrow" aria-hidden="true">↗</span></a>
</article>
