<header class="shelf-intro shelf-{{ page.section }}">
<div><a class="crumb" href="{{ '/' | relative_url }}">← 回到工作室</a><p class="shelf-eyebrow">{{ page.eyebrow }}</p><h1>{{ page.title }}<span>。</span></h1><p class="shelf-description">{{ page.description }}</p></div>
{% if page.character_cutout %}<div class="shelf-character shelf-cutout" aria-hidden="true"><img src="{{ '/assets/optimized/character-blue-cutout.webp' | relative_url }}" alt="" width="640" height="486" decoding="async" /><span class="shelf-spark">✧</span></div>{% else %}<div class="shelf-character" aria-hidden="true"><span class="portrait"><img src="{{ page.portrait | relative_url }}" alt="" width="154" height="154" decoding="async" /></span><span class="shelf-bubble">{{ page.bubble }}</span><span class="shelf-spark">✧</span></div>{% endif %}
</header>
