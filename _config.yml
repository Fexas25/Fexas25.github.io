# Site settings
title: "MX · 摸鱼工作室"
description: "我是 MX，喜欢算法、游戏开发、绘画和 AI 工作流。这里记录日常、分享学习笔记，也收藏慢慢做出来的小作品。"
lang: zh-CN
author:
  name: MX
  url: https://fexas25.github.io/about/
# Reuse the existing homepage illustration; no separate artwork is required.
share_image: /picture/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20260128002716_44_58.jpg
share_image_alt: 阳光洒进摆着花草与照片的房间，橙发女孩趴在笔记本旁
share_image_width: 1440
share_image_height: 824
url: "https://fexas25.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
strict_front_matter: true

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:name/
  cp:
    output: true
    permalink: /competitive-programming/:name/
  gamejam:
    output: true
    permalink: /game-jam/:name/
  projects:
    output: true
    permalink: /projects/:name/
  art:
    output: true
    permalink: /art/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - .vscode/
  - .cursor/

# Include
include:
  - _pages

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: cp
    values:
      layout: post
  - scope:
      path: ""
      type: gamejam
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: post
  - scope:
      path: ""
      type: art
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page
