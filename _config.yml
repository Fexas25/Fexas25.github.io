# Site settings
title: "MX的摸鱼生活"
description: "这里是MX Meow！记录摸鱼生活，分享有趣的东西。快来一起摸鱼吧！"
lang: zh-CN
author:
  name: MX
  url: https://fexas25.github.io/about/
# Reuse the existing homepage illustration; no separate artwork is required.
share_image: /assets/optimized/studio-room-share.jpg
share_image_alt: 阳光洒进摆着花草与照片的房间，橙发女孩趴在笔记本旁
share_image_width: 1440
share_image_height: 824
url: "https://fexas25.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
strict_front_matter: true

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:name/
  cp:
    output: true
    permalink: /competitive-programming/:name/
  gamejam:
    output: true
    permalink: /game-jam/:name/
  projects:
    output: true
    permalink: /projects/:name/
  art:
    output: true
    permalink: /art/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - _project-backup
  - music/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - .vscode/
  - .cursor/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: cp
    values:
      layout: post
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: gamejam
    values:
      layout: post
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: post
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: art
    values:
      layout: post
      noindex: true
      sitemap: false
