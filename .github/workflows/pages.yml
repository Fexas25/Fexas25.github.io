name: Website checks and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Build and check website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _checks/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: npm ci --prefix _checks --ignore-scripts
      - name: Check guestbook moderation security and bundle
        run: |
          npm ci --prefix _community
          npm test --prefix _community
          npm run build --prefix _community
          npm ci --prefix _community/admin
          npm test --prefix _community/admin
          npm run build --prefix _community/admin
      - name: Prevent private content in public build
        run: node _checks/private-source.cjs
      - name: Build production site
        id: build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check internal links and assets
        id: links
        run: python _checks/links.py _site
      - name: Check sharing and search metadata
        id: seo
        run: python _checks/seo.py _site
      - name: Check generated search index
        id: search
        run: python _checks/search-index.py _site
      - name: Test search, writing, backup and daily interactions
        id: features
        run: npm test --prefix _checks
      - name: Install mobile browser engines
        working-directory: _checks
        run: npx playwright install --with-deps chromium webkit
      - name: Test mobile layout and critical actions
        id: mobile
        run: npm run test:browser --prefix _checks
      - name: Save mobile browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-report
          path: |
            _checks/playwright-report/
            _checks/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish check summary
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          LINKS: ${{ steps.links.outcome }}
          SEO: ${{ steps.seo.outcome }}
          SEARCH: ${{ steps.search.outcome }}
          FEATURES: ${{ steps.features.outcome }}
          MOBILE: ${{ steps.mobile.outcome }}
        run: |
          {
            echo '## 网站发布检查'
            echo "- 正式构建：$BUILD"
            echo "- 站内链接与素材：$LINKS"
            echo "- 分享与搜索信息：$SEO"
            echo "- 全站搜索索引：$SEARCH"
            echo "- 搜索、草稿、备份及抽签功能：$FEATURES"
            echo "- 手机浏览器布局与关键操作：$MOBILE"
            echo '手机检查报告在本次运行的 mobile-browser-report 附件中；失败项包含截图和操作轨迹，保留 14 天。'
            echo ''
            echo '只有全部检查通过，main 分支才会发布。失败时展开对应步骤查看文件路径和原因；修正后再次提交即可。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  external-links:
    name: External link advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Report external link availability
        run: python3 _checks/links.py _site --external

  deploy:
    name: Publish verified website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
